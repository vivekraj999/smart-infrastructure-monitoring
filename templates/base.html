<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectAI - Smart Project Monitoring</title>
    <link rel="stylesheets" href="{{ url_for('static', filename='main.css') }}">
    <script src ="{{ url_for('static', filename='main.js') }}"></script>
</head>
<body>

    <aside class="sidebar">

        <div class="logo">

            <h2>ProjectAI</h2>

            <p>Smart Project Monitoring</p>

        </div>

        <nav>

            <button class="nav-btn active" data-page="dashboard">
                🏠 Dashboard
            </button>

            <button class="nav-btn" data-page="documents">
                📄 Documents
            </button>

            <button class="nav-btn" data-page="schedule">
                📅 Schedule
            </button>

            <button class="nav-btn" data-page="progress">
                📊 Progress
            </button>

            <button class="nav-btn" data-page="risks">
                ⚠️ Risks & Delays
            </button>

            <button class="nav-btn" data-page="assistant">
                🤖 AI Assistant
            </button>

        </nav>

    </aside>

    <main class="main">
        <header>
            <h1>ProjectAI - Smart Project Monitoring</h1>
        </header>
        {% block content %}{% endblock %}
    </main>
