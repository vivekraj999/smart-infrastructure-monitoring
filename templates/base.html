<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectAI - Smart Project Monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <aside class="sidebar">

        <div class="logo">

            <h2>ProjectAI</h2>

            <p>Smart Project Monitoring</p>

        </div>

        <nav>
            <a href="{{ url_for('dashboard') }}" class="nav-btn{% if request.endpoint == 'dashboard' %} active{% endif %}">
                🏠 Dashboard
            </a>

            <a href="{{ url_for('documents') }}" class="nav-btn{% if request.endpoint == 'documents' %} active{% endif %}">
                📄 Documents
            </a>

            <a href="{{ url_for('schedule') }}" class="nav-btn{% if request.endpoint == 'schedule' %} active{% endif %}">
                📅 Schedule
            </a>

            <a href="{{ url_for('progress') }}" class="nav-btn{% if request.endpoint == 'progress' %} active{% endif %}">
                📊 Progress
            </a>

            <a href="{{ url_for('risks') }}" class="nav-btn{% if request.endpoint == 'risks' %} active{% endif %}">
                ⚠️ Risks & Delays
            </a>

            <a href="{{ url_for('assistant') }}" class="nav-btn{% if request.endpoint == 'assistant' %} active{% endif %}">
                🤖 AI Assistant
            </a>
        </nav>

    </aside>

    <main class="main">
        <header>
            <h1>ProjectAI - Smart Project Monitoring</h1>
        </header>
        {% block content %}{% endblock %}
    </main>

    <script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
