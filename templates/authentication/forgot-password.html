<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ProjectAI - Reset Password</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <div class="auth-container">


        <div class="auth-info">

            <div class="brand">

                <h1>ProjectAI</h1>

                <p>
                    Intelligent Project Management
                </p>

            </div>


            <div class="info-content">

                <h2>
                    Reset your password.
                </h2>

                <p>
                    Enter your registered email
                    address and we'll help you
                    reset your password.
                </p>

            </div>

        </div>



        <div class="auth-form-container">

            <div class="auth-card">

                <h2>Forgot password?</h2>

                <p class="subtitle">

                    Enter your email address
                    to continue.

                </p>


                <form id="forgotForm">


                    <div class="form-group">

                        <label for="forgotEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="forgotEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Send Reset Link
                    </button>


                    <p
                        id="forgotMessage"
                        class="message"
                    ></p>


                </form>


                <div class="auth-footer">

                    <a href="login.html">
                        ← Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
